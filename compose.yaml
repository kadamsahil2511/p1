name: p1
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - p1
  p1:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      DATA_DIR: /app/data
      PYTHON_BIN: /opt/venv/bin/python
      P1_API_URL: http://127.0.0.1:8765
      EVOLUTION_API_URL: http://evolution:8080
    volumes:
      - ./data:/app/data
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      - evolution
  evolution:
    build:
      context: .
      dockerfile: Dockerfile.evolution
    image: p1-evolution:pairing-patch-rc14
    restart: unless-stopped
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${POSTGRES_PASSWORD}@postgres:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: p1
      CACHE_REDIS_ENABLED: 'true'
      CACHE_REDIS_URI: redis://redis:6379/6
      WEBHOOK_GLOBAL_ENABLED: 'true'
      WEBHOOK_GLOBAL_URL: http://p1:3000/webhook/${WEBHOOK_SECRET}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: 'false'
      WEBHOOK_EVENTS_MESSAGES_UPSERT: 'true'
      TELEMETRY_ENABLED: 'false'
    volumes:
      - evolution_instances:/evolution/instances
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: evolution
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
volumes:
  caddy_data:
  caddy_config:
  evolution_instances:
  postgres_data:
  redis_data:
